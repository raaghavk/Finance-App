name: paisa_track
description: A comprehensive personal finance tracking app for Indian users.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.28

  # Code Generation Annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.2

  # Backend
  supabase_flutter: ^2.9.0

  # Charts
  fl_chart: ^0.70.2

  # UI Utilities
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ML / OCR
  google_mlkit_text_recognition: ^0.14.0

  # Audio
  record: ^5.2.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # SMS
  telephony: ^0.2.0

  # In-App Purchases
  purchases_flutter: ^8.5.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  device_info_plus: ^11.2.0

  # Security
  local_auth: ^2.3.0

  # Export
  csv: ^6.0.0
  pdf: ^3.11.2
  printing: ^5.13.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans/NotoSans-Light.ttf
          weight: 300
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Light.ttf
          weight: 300
