name: paisa_track
description: A comprehensive personal finance tracking app for Indian users.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.2

  # Charts
  fl_chart: ^0.70.2

  # UI Utilities
  shimmer: ^3.0.0

  # Camera & Image
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.5.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  device_info_plus: ^11.2.0

  # Export
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans/NotoSans-Light.ttf
          weight: 300
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari-Light.ttf
          weight: 300
