name: Build iOS App

on:
  push:
    branches: [claude/india-fintech-tracker-op2TY, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate iOS project files
        run: flutter create --project-name paisa_track --org com.paisatrack --platforms ios .

      - name: Restore source files
        run: git checkout -- lib/ pubspec.yaml analysis_options.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: paisa-track-ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
