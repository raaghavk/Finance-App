name: Build & Deploy PaisaTrack Web

on:
  push:
    branches: [claude/india-fintech-tracker-op2TY, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create web platform files
        run: |
          flutter create --project-name paisa_track --org com.paisatrack --platforms web .
          git checkout -- pubspec.yaml lib/

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href "/Finance-App/" || true

      - name: Check build output
        run: |
          if [ -d "build/web" ] && [ -f "build/web/index.html" ]; then
            echo "Build succeeded!"
            ls -la build/web/
          else
            echo "Flutter build failed. Creating placeholder page..."
            mkdir -p build/web
            cat > build/web/index.html << 'HTMLEOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>PaisaTrack - Coming Soon</title>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #00897B 0%, #004D40 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
                .container { text-align: center; padding: 40px 20px; max-width: 500px; }
                .logo { font-size: 72px; margin-bottom: 16px; }
                h1 { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
                .tagline { font-size: 18px; opacity: 0.9; margin-bottom: 32px; font-style: italic; }
                .features { text-align: left; background: rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 32px; backdrop-filter: blur(10px); }
                .features h2 { font-size: 20px; margin-bottom: 16px; text-align: center; }
                .feature { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 15px; }
                .feature span { font-size: 24px; }
                .badge { display: inline-block; background: #FF6B35; color: white; padding: 8px 24px; border-radius: 24px; font-size: 14px; font-weight: 600; margin-top: 8px; }
                .footer { margin-top: 32px; font-size: 13px; opacity: 0.7; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="logo">₹</div>
                <h1>PaisaTrack</h1>
                <p class="tagline">Har paisa, har pal.</p>
                <div class="features">
                  <h2>India-First Finance Tracker</h2>
                  <div class="feature"><span>🎤</span> Voice input in Hindi, Hinglish & more</div>
                  <div class="feature"><span>💬</span> Chat-based expense logging</div>
                  <div class="feature"><span>📷</span> Receipt scanning with OCR</div>
                  <div class="feature"><span>📊</span> Smart budgets & spending charts</div>
                  <div class="feature"><span>🔔</span> Bill reminders & alerts</div>
                  <div class="feature"><span>💰</span> 30+ Indian categories (Kirana, Chai, Auto...)</div>
                  <div class="feature"><span>🇮🇳</span> ₹ formatting, Hindi UI, offline-first</div>
                </div>
                <div class="badge">Coming Soon on iOS & Android</div>
                <div class="footer">Built with Flutter • Local-first • No login required</div>
              </div>
            </body>
            </html>
          HTMLEOF
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
