name: Build & Deploy PaisaTrack Web

on:
  push:
    branches: [claude/india-fintech-tracker-op2TY, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create web platform
        run: |
          rm -rf web/
          flutter create --project-name paisa_track --org com.paisatrack --platforms web .

      - name: Restore source files and use web pubspec
        run: |
          git checkout -- lib/ analysis_options.yaml
          cp pubspec_web.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href "/Finance-App/"

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la build/web/
          echo "=== Checking for Flutter files ==="
          test -f build/web/main.dart.js && echo "main.dart.js found" || true
          test -f build/web/flutter.js && echo "flutter.js found" || true
          test -d build/web/assets && echo "assets/ found" || true
          test -f build/web/flutter_bootstrap.js && echo "flutter_bootstrap.js found" || true
          test -f build/web/index.html && echo "index.html found" || true
          echo "=== index.html content ==="
          cat build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
