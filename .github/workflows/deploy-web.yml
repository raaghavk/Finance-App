name: Build & Deploy PaisaTrack Web

on:
  push:
    branches: [claude/india-fintech-tracker-op2TY, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create web platform
        run: |
          rm -rf web/
          flutter create --project-name paisa_track --org com.paisatrack --platforms web .

      - name: Restore source files
        run: git checkout -- lib/ analysis_options.yaml

      - name: Create web-compatible pubspec
        run: |
          cat > pubspec.yaml << 'PUBEOF'
          name: paisa_track
          description: India-first personal finance tracking app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: ^3.5.0

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            flutter_riverpod: ^2.6.1
            go_router: ^14.8.1
            fl_chart: ^0.70.2
            uuid: ^4.5.1
            intl: ^0.20.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          PUBEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href "/Finance-App/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
