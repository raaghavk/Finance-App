  <title>Zenith — Finance</title>
  <script>
    (function () {
      var onPages = location.pathname.indexOf('/Finance-App') === 0;
      var el = document.createElement('base');
      el.href = onPages ? '/Finance-App/' : '/';
      document.head.appendChild(el);
      // Fake iPhone chrome is OFF by default (Vercel + real phones). Opt-in: localhost desktop or ?demo=1.
      function zenithShouldUseDeviceFrame(loc) {
        loc = loc || location;
        try {
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return false;
        } catch (e) {}
        try {
          if (/Capacitor/i.test(String(navigator.userAgent || ''))) return false;
        } catch (e) {}
        var host = String(loc.hostname || '');
        if (/\.vercel\.app$/i.test(host)) return false;
        var standalone = false;
        try {
          standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        } catch (e) {}
        if (standalone) return false;
        if (window.matchMedia('(max-width: 540px)').matches) return false;
        var local = host === 'localhost' || host === '127.0.0.1' || host === '::1';
        var demo = /(?:^|[?&])demo=1(?:&|$)/.test(String(loc.search || ''));
        return local || demo;
      }
      document.documentElement.dataset.zenithChrome = zenithShouldUseDeviceFrame() ? 'frame' : 'native';
      window.zenithShouldUseDeviceFrame = zenithShouldUseDeviceFrame;
    })();
  </script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --zenith-page: #F2F5FA;
      --zenith-ink: #0F172A;
      --zenith-accent: #2563EB;
      --zenith-pad-top: calc(env(safe-area-inset-top, 0px) + 12px);
      --zenith-pad-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    }
    html[data-zenith-chrome="frame"] {
      --zenith-pad-top: 70px;
      --zenith-pad-bottom: 110px;
    }

    /* Default: full-bleed app (production, iPhone Safari, PWA). */
    body {
      background: var(--zenith-page);
      display: block;
      min-height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100dvh;
      height: 100vh;
      height: 100svh;
      display: block;
    }
    #device-scaler {
      transform: none !important;
      transform-origin: center center;
      width: 100%;
      height: 100%;
    }

    /* Opt-in desktop mockup only (localhost / ?demo=1, never Vercel). */
    html[data-zenith-chrome="frame"] body {
      background: radial-gradient(ellipse at 40% 60%, #0B1220 0%, #020617 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    html[data-zenith-chrome="frame"] body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    html[data-zenith-chrome="frame"] #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html[data-zenith-chrome="frame"] #device-scaler {
      transform: none;
      width: auto;
      height: auto;
    }

    /* Hide scrollbars everywhere */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Font smoothing */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Remove tap highlights */
    * { -webkit-tap-highlight-color: transparent; }

    /* Number inputs — hide arrows */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* Prevent text selection in interactive areas */
    button, [role=button] { user-select: none; }
  </style>
</head>

  <script>
    // Scale device to fit viewport with padding
    function scaleDevice() {
      const el = document.getElementById('device-scaler');
      if (!el) return;
      if (document.documentElement.dataset.zenithChrome !== 'frame') {
        el.style.transform = 'none';
        return;
      }
      const W = window.innerWidth;
      const H = window.innerHeight;
      const deviceW = 402;
      const deviceH = 874;
      const scale = Math.min((W - 48) / deviceW, (H - 48) / deviceH, 1.1);
      el.style.transform = `scale(${scale})`;
    }
    window.scaleDevice = scaleDevice;
    window.addEventListener('resize', scaleDevice);
    // Run after React renders
    setTimeout(scaleDevice, 200);
  </script>
