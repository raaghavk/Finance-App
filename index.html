<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith — Finance</title>
  <script>
    (function () {
      var onPages = location.pathname.indexOf('/Finance-App') === 0;
      var el = document.createElement('base');
      el.href = onPages ? '/Finance-App/' : '/';
      document.head.appendChild(el);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 40% 60%, #0a1628 0%, #060608 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,122,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,122,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scale device to fit viewport */
    #device-scaler {
      transform-origin: center center;
    }

    /* Hide scrollbars everywhere */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Font smoothing */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Remove tap highlights */
    * { -webkit-tap-highlight-color: transparent; }

    /* Number inputs — hide arrows */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* Prevent text selection in interactive areas */
    button, [role=button] { user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="state.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components/Onboarding.jsx"></script>
  <script type="text/babel" src="components/Home.jsx"></script>
  <script type="text/babel" src="components/AddExpense.jsx"></script>
  <script type="text/babel" src="components/Analysis.jsx"></script>
  <script type="text/babel" src="components/TravelExtras.jsx"></script>
  <script type="text/babel" src="components/TravelMode.jsx"></script>
  <script type="text/babel" src="components/Profile.jsx"></script>
  <script type="text/babel" src="components/BudgetSetup.jsx"></script>
  <script type="text/babel" src="components/Plan.jsx"></script>
  <script type="text/babel" src="components/Search.jsx"></script>
  <script type="text/babel" src="components/Recurring.jsx"></script>
  <script type="text/babel" src="components/SavingsGoals.jsx"></script>
  <script type="text/babel" src="components/CategoryDetail.jsx"></script>
  <script type="text/babel" src="components/Notifications.jsx"></script>
  <script type="text/babel" src="components/Reports.jsx"></script>
  <script type="text/babel" src="components/SplitExpense.jsx"></script>
  <script type="text/babel" src="components/NetWorth.jsx"></script>
  <script type="text/babel" src="components/CashflowCalendar.jsx"></script>
  <script type="text/babel" src="components/VoiceScan.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Scale device to fit viewport with padding
    function scaleDevice() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const deviceW = 402;
      const deviceH = 874;
      const scale = Math.min((W - 48) / deviceW, (H - 48) / deviceH, 1.1);
      const el = document.getElementById('device-scaler');
      if (el) el.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleDevice);
    // Run after React renders
    setTimeout(scaleDevice, 200);
  </script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="84" fill="#0a1628"/>
      <rect x="35" y="8" width="50" height="68" rx="8" fill="#1a1a2e"/>
      <rect x="40" y="20" width="40" height="22" rx="5" fill="#007AFF" opacity="0.9"/>
      <rect x="40" y="48" width="18" height="6" rx="3" fill="#2a2a3e"/>
      <rect x="40" y="58" width="28" height="6" rx="3" fill="#2a2a3e"/>
      <circle cx="60" cy="72" r="4" fill="#007AFF"/>
    </svg>
  </template>
</body>
</html>
