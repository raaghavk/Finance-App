<!DOCTYPE html>
<html lang="en" data-zenith-chrome="native">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenith">
  <title>Zenith — Finance</title>
  <script>
    (function () {
      var onPages = location.pathname.indexOf('/Finance-App') === 0;
      var el = document.createElement('base');
      el.href = onPages ? '/Finance-App/' : '/';
      document.head.appendChild(el);
      document.documentElement.dataset.zenithChrome = 'native';
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --zenith-page: #F2F5FA;
      --zenith-ink: #0F172A;
      --zenith-muted: #64748B;
      --zenith-accent: #2563EB;
      --zenith-card: #FFFFFF;
      --zenith-cream: #E8EEF7;
      --zenith-safe-top: 0px;
      --zenith-safe-bottom: 0px;
      --zenith-pad-top: calc(env(safe-area-inset-top, 0px) + 14px);
      --zenith-pad-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
    }

    html {
      background: var(--zenith-page, #F2F5FA);
    }
    body {
      background: var(--zenith-page, #F2F5FA);
      display: block;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    #root {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      height: 100svh;
      display: block;
    }
    #device-scaler {
      transform: none !important;
      width: 100%;
      height: 100%;
    }

    /* Hide scrollbars everywhere */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Font smoothing */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Remove tap highlights */
    * { -webkit-tap-highlight-color: transparent; }

    /* Number inputs — hide arrows */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* Prevent text selection in interactive areas */
    button, [role=button] { user-select: none; }
  </style>
</head>
<body>
  <div id="root">
    <p style="padding: 96px 24px 24px; font-family: Inter, sans-serif; font-size: 15px; color: #2563EB; text-align: center;">Loading Zenith…</p>
  </div>

  <script src="lib/ios-safe-area.js"></script>
  <script src="lib/zenith-chrome.js"></script>
  <script src="lib/theme.js"></script>
  <script src="lib/local-ledger.js"></script>
  <script type="text/babel" src="state.js"></script>
  <script src="lib/notion/map.js"></script>
  <script src="lib/notion/browser.js"></script>
  <script src="lib/parse-expense.js"></script>
  <script src="lib/capture.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components/Onboarding.jsx"></script>
  <script type="text/babel" src="components/Home.jsx"></script>
  <script type="text/babel" src="components/MoneyForms.jsx"></script>
  <script type="text/babel" src="components/AddExpense.jsx"></script>
  <script type="text/babel" src="components/Analysis.jsx"></script>
  <script type="text/babel" src="components/TravelExtras.jsx"></script>
  <script type="text/babel" src="components/TravelMode.jsx"></script>
  <script type="text/babel" src="components/LockScreen.jsx"></script>
  <script type="text/babel" src="components/Paywall.jsx"></script>
  <script type="text/babel" src="components/Profile.jsx"></script>
  <script type="text/babel" src="components/AccountsManager.jsx"></script>
  <script type="text/babel" src="components/CategoriesManager.jsx"></script>
  <script type="text/babel" src="components/BudgetSetup.jsx"></script>
  <script type="text/babel" src="components/Plan.jsx"></script>
  <script type="text/babel" src="components/Search.jsx"></script>
  <script type="text/babel" src="components/Recurring.jsx"></script>
  <script type="text/babel" src="components/SavingsGoals.jsx"></script>
  <script type="text/babel" src="components/CategoryDetail.jsx"></script>
  <script type="text/babel" src="components/Notifications.jsx"></script>
  <script type="text/babel" src="components/Reports.jsx"></script>
  <script type="text/babel" src="components/SplitExpense.jsx"></script>
  <script type="text/babel" src="components/NetWorth.jsx"></script>
  <script type="text/babel" src="components/CashflowCalendar.jsx"></script>
  <script type="text/babel" src="components/VoiceScan.jsx"></script>
  <script type="text/babel" src="components/NotionExpenses.jsx"></script>
  <script type="text/babel" src="components/NotionMoney.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    function scaleDevice() {
      const el = document.getElementById('device-scaler');
      if (el) el.style.transform = 'none';
    }
    window.scaleDevice = scaleDevice;
  </script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="84" fill="#0a1628"/>
      <rect x="35" y="8" width="50" height="68" rx="8" fill="#1a1a2e"/>
      <rect x="40" y="20" width="40" height="22" rx="5" fill="#2563EB" opacity="0.9"/>
      <rect x="40" y="48" width="18" height="6" rx="3" fill="#2a2a3e"/>
      <rect x="40" y="58" width="28" height="6" rx="3" fill="#2a2a3e"/>
      <circle cx="60" cy="72" r="4" fill="#2563EB"/>
    </svg>
  </template>
</body>
</html>
